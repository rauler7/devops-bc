controller:
  serviceType: NodePort
  ingress:
    enabled: true
    annotations:
      kubernetes.io/ingress.class: nginx
  resources:
    requests:
      cpu: 500m
      memory: 512Mi
    limits:
      cpu: 1000m
      memory: 1Gi
  installPlugins:
    - kubernetes:1.31.3
    - workflow-aggregator:2.6
    - git:4.11.0
    - configuration-as-code:1.55
    - blueocean:1.25.3
  javaOpts: >-
    -Xms512m
    -Xmx1024m
    -XX:MaxRAM=2g
    -Dhudson.model.DirectoryBrowserSupport.CSP=""
  lifecycle:
    postStart:
      exec:
        command:
          - /bin/sh
          - -c
          - |
            echo "Waiting for Jenkins to start..."
            sleep 30
            echo "Jenkins startup complete"

persistence:
  enabled: true
  size: 8Gi
  storageClass: "standard"

serviceAccount:
  create: true
  annotations: {}

agent:
  enabled: true
  resources:
    requests:
      cpu: 200m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
