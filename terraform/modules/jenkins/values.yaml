controller:
  serviceType: NodePort
  ingress:
    enabled: true
    annotations:
      kubernetes.io/ingress.class: nginx
  resources:
    requests:
      cpu: 500m
      memory: 512Mi
    limits:
      cpu: 1000m
      memory: 1Gi
  installPlugins:
    - kubernetes:1.31.3
    - workflow-aggregator:2.6
    - git:4.11.0
    - configuration-as-code:1.55
    - blueocean:1.25.3
  javaOpts: >-
    -Xms512m
    -Xmx1024m
    -XX:MaxRAM=2g
    -Dhudson.model.DirectoryBrowserSupport.CSP=""

persistence:
  enabled: true
  size: 8Gi

serviceAccount:
  create: true
  annotations: {}
