controller:
  image:
    tag: "2.504.2"
  serviceType: NodePort

  ingress:
    enabled: true
    annotations:
      kubernetes.io/ingress.class: nginx

  resources:
    requests:
      cpu: 500m
      memory: 512Mi
    limits:
      cpu: 1000m
      memory: 1Gi

  installPlugins:
    - kubernetes
    - workflow-aggregator
    - git
    - configuration-as-code
    - blueocean

  javaOpts: >
    -Xms512m -Xmx1024m -XX:MaxRAM=2g -Dhudson.model.DirectoryBrowserSupport.CSP=""

  lifecycle:
    postStart:
      exec:
        command:
          - /bin/sh
          - -c
          - |
            echo "Waiting for Jenkins to start..."
            sleep 30
            echo "Jenkins startup complete"

  # Add plugin installation command
  command:
    - /bin/sh
    - -c
    - |
      jenkins-plugin-cli --plugins kubernetes workflow-aggregator git configuration-as-code blueocean --resolve-dependencies
      /usr/local/bin/jenkins.sh

persistence:
  enabled: true
  size: 8Gi
  storageClass: "standard"

serviceAccount:
  create: true
  annotations: {}

agent:
  enabled: true
  resources:
    requests:
      cpu: 200m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
