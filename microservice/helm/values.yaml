replicaCount: 2

image:
  repository: microservice
  tag: latest
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 80

vault:
  enabled: true
  role: microservice
  path: secret/microservice
  agent:
    enabled: true
    inject: true
    configMap: vault-agent-config
    template:
      - name: app-config
        path: secret/microservice
        template: |
          {{ "{{" }} with secret "secret/microservice" {{ "}}" }}
          {
            "app_config": "{{ "{{" }} .Data.data.app_config {{ "}}" }}",
            "app_secret": "{{ "{{" }} .Data.data.app_secret {{ "}}" }}"
          }
          {{ "{{" }} end {{ "}}" }}

# Environment variables configuration
env:
  APP_CONFIG: ""
  APP_SECRET: ""

# Environment configuration
environment: development

resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 250m
    memory: 256Mi

nodeSelector: {}

tolerations: []

affinity: {}
