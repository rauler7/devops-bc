replicaCount: 2

# Namespace configuration
namespace:
  create: true
  name: ""

image:
  repository: microservice
  tag: latest
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 80

vault:
  enabled: true
  role: microservice
  path: secret/data/microservice
  agent:
    enabled: true
    inject: true
    configMap: vault-agent-config
    template:
      - name: app-config
        path: secret/data/microservice
        template: |
          {{ "{{" }} with secret "secret/data/microservice" {{ "}}" }}
          {
            "username": "{{ "{{" }} .Data.data.username {{ "}}" }}",
            "password": "{{ "{{" }} .Data.data.password {{ "}}" }}"
          }
          {{ "{{" }} end {{ "}}" }}

# Environment variables configuration
env:
  APP_CONFIG: ""
  APP_SECRET: ""

# Environment configuration
# This should be set via --set environment=<env> when deploying
environment: ""

resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 250m
    memory: 256Mi

nodeSelector: {}

tolerations: []

affinity: {}
