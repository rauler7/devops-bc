apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-vault-agent-config
  labels:
    app: {{ .Release.Name }}
data:
  vault-agent-config.hcl: |
    exit_after_auth = true
    pid_file = "/home/vault/pidfile"

    auto_auth {
      method "kubernetes" {
        mount_path = "auth/kubernetes"
        config = {
          role = "{{ .Values.vault.role }}"
        }
      }
    }

    template {
      source      = "/vault/template/app-config.json.tpl"
      destination = "/vault/secrets/app-config.json"
    }

    vault {
      address = "{{ .Values.vault.addr }}"
    }
