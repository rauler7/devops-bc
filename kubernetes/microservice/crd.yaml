apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: microserviceconfigs.devops.com
spec:
  group: devops.com
  names:
    kind: MicroserviceConfig
    plural: microserviceconfigs
    singular: microserviceconfig
    shortNames:
      - msconfig
  scope: Namespaced
  versions:
    - name: v1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                logLevel:
                  type: string
                  enum: [info, debug, warn, error]
                restartPolicy:
                  type: string
                  enum: [Always, OnFailure, Never]
                healthCheckPath:
                  type: string
                configProperties:
                  type: object
                  additionalProperties:
                    type: string
      subresources:
        status: {}
