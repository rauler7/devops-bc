apiVersion: v1
kind: ConfigMap
metadata:
  name: microservice-config
  namespace: development
data:
  app.properties: |
    greeting.message=Hello from ConfigMap!
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: microservice
  namespace: development
spec:
  replicas: 2
  selector:
    matchLabels:
      app: microservice
  template:
    metadata:
      labels:
        app: microservice
    spec:
      containers:
        - name: microservice
          image: localhost:5000/microservice:latest
          ports:
            - containerPort: 8080
          env:
            - name: GREETING_MESSAGE
              value: "Hello from Environment Variable!"
            - name: APP_SECRET
              valueFrom:
                secretKeyRef:
                  name: microservice-secret
                  key: app-secret
            - name: APP_CONFIG_PROPERTY
              value: "development-config"
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          volumeMounts:
            - name: config-volume
              mountPath: /app/config
      volumes:
        - name: config-volume
          configMap:
            name: microservice-config
---
apiVersion: v1
kind: Service
metadata:
  name: microservice
  namespace: development
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: 8080
  selector:
    app: microservice
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: microservice-ingress
  namespace: development
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
spec:
  rules:
    - http:
        paths:
          - path: /env
            pathType: Prefix
            backend:
              service:
                name: microservice
                port:
                  number: 80
          - path: /config
            pathType: Prefix
            backend:
              service:
                name: microservice
                port:
                  number: 80
